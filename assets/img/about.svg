<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-label="The House">
  <defs>
    <linearGradient id="g_about" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e7ee"/>
      <stop offset="52%" stop-color="#e9cddb"/>
      <stop offset="100%" stop-color="#d8b6c8"/>
    </linearGradient>
    <pattern id="p_about" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="46" stroke="#ffffff" stroke-opacity=".35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="1125" fill="url(#g_about)"/>
  <rect width="900" height="1125" fill="url(#p_about)"/>
  <circle cx="648" cy="337" r="225" fill="#e576a1" fill-opacity=".16"/>
  <circle cx="234" cy="832" r="160" fill="#a63f6d" fill-opacity=".12"/>
  <text x="50%" y="49%" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="70" fill="#8d5b74" letter-spacing="2">The House</text>
  <text x="50%" y="49%" dy="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="28" fill="#a4788c" letter-spacing="4">REPLACE WITH SITE IMAGE</text>
</svg>
